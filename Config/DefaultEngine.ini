[/Script/NavigationSystem.RecastNavMesh]
; Bots. The navmesh is generated on the host when a match map loads instead of being baked in the
; editor: the maps are rebuilt by Content/Python/airsoft_setup.py, which places a NavMeshBoundsVolume
; but can't reliably bake nav data from a script. Dynamic keeps it matched to the real collision
; (blockers carve it, so bots stay off roofs/containers); nothing large moves at runtime, so rebuilds
; after load are rare and small. Clients never build navigation (bAllowClientSideNavigation=False).
RuntimeGeneration=Dynamic
bForceRebuildOnLoad=True
; Character capsule: radius 36 cm, height 184 cm (if the engine falls back to its built-in 35/144
; agent instead, that works too on these maps). Stairs in the layouts rise 20 cm per step, well under
; the default 35 cm max step height.
AgentRadius=36.0
AgentHeight=184.0
AgentMaxSlope=44.0
